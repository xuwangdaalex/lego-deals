name: Update LEGO deals API

on:
  workflow_dispatch:
  schedule:
    # Run at both UTC hours; scraper proceeds only when Sydney local time is 08:00.
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# Prevent overlapping runs of this workflow from competing to update the API.
concurrency:
  group: lego-deals-api
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Refresh JSON API
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python scraper/update_api.py --force
          else
            python scraper/update_api.py
          fi
      - name: Commit and push updated API files
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain api)" ]]; then
            echo "API files are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/
          git commit -m "Update LEGO deals API"

          # Another process may update main between fetch and push.
          # Retry by rebasing this generated-data commit onto the newest main.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt of 5"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Could not rebase the API update onto origin/main. A conflict needs manual review."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "API update pushed successfully."
              exit 0
            fi

            echo "Push rejected; retrying after fetching the latest main."
            sleep 2
          done

          echo "::error::Could not push after 5 attempts. Check whether main is being updated by another workflow or protected by a branch rule."
          exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload API site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
