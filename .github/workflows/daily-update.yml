name: Update LEGO deals API

on:
  workflow_dispatch:
  schedule:
    # Run at both UTC hours; scraper proceeds only when Sydney local time is 08:00.
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh JSON API
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python scraper/update_api.py --force
          else
            python scraper/update_api.py
          fi
      - name: Commit updated API files
        run: |
          if [[ -n "$(git status --porcelain api)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add api/
            git commit -m "Update LEGO deals API"
            git push
          else
            echo "API files are unchanged."
          fi
