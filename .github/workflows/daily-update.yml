name: Update LEGO deals API

on:
  workflow_dispatch:
  schedule:
    # Run at both UTC hours; scraper proceeds only when Sydney local time is 08:00.
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# Prevent overlapping runs from generating and pushing API updates at the same time.
concurrency:
  group: lego-deals-api
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh JSON API
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python scraper/update_api.py --force
          else
            python scraper/update_api.py
          fi
      - name: Commit updated API files
        run: |
          if [[ -n "$(git status --porcelain api)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add api/
            git commit -m "Update LEGO deals API"
            # Rebase the generated-data commit onto any changes pushed while the scraper ran.
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "API files are unchanged."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload API site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
